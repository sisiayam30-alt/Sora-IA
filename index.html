<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Option AI Signal Pro Engine</title>
    <!-- Chart.js sy FontAwesome via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b0e14;
            --card-bg: #151a24;
            --accent-green: #00e676;
            --accent-red: #ff1744;
            --accent-blue: #29b6f6;
            --text-main: #ffffff;
            --text-sub: #90a4ae;
            --border-color: #232a3b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 320px 1fr 340px;
            gap: 20px;
        }

        @media (max-width: 1200px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-weight: bold;
            outline: none;
        }

        .time-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .btn-time {
            padding: 8px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-time.active, .btn-time:hover {
            background: var(--accent-blue);
            color: #000;
        }

        .btn-action {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-analyse {
            background: linear-gradient(45deg, #0288d1, #29b6f6);
            color: white;
            box-shadow: 0 4px 15px rgba(41, 182, 246, 0.3);
        }

        .btn-analyse:hover {
            opacity: 0.9;
        }

        /* Signal Display Card */
        .signal-box {
            text-align: center;
            padding: 25px;
            background: var(--bg-dark);
            border-radius: 12px;
            margin-bottom: 20px;
            border: 2px solid var(--border-color);
        }

        .signal-title {
            font-size: 36px;
            font-weight: 900;
            margin: 10px 0;
        }

        .signal-call { color: var(--accent-green); border-color: var(--accent-green); }
        .signal-put { color: var(--accent-red); border-color: var(--accent-red); }
        .signal-wait { color: var(--text-sub); border-color: var(--border-color); }

        .confidence-meter {
            height: 10px;
            background: var(--border-color);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }

        .confidence-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-blue);
            transition: width 0.5s ease;
        }

        /* Indicator Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stat-item {
            background: var(--bg-dark);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
        }

        .stat-item span {
            display: block;
            color: var(--text-sub);
        }

        .stat-item strong {
            font-size: 14px;
        }

        /* Martingale Section */
        .martingale-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-win { background: var(--accent-green); color: #000; }
        .btn-loss { background: var(--accent-red); color: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fa-solid fa-brain-circuit"></i> POCKET OPTION AI ENGINE PRO</h1>
        <div style="font-size: 14px; color: var(--text-sub);">
            <i class="fa-solid fa-circle" style="color: var(--accent-green); font-size: 10px;"></i> Signal Confluence Mode (>80%)
        </div>
    </div>

    <div class="grid-container">
        
        <!-- PANEL LEFT: CONFIGURATION -->
        <div class="card">
            <h2><i class="fa-solid fa-sliders"></i> Configurations</h2>
            
            <div class="form-group">
                <label>Marchés (Pocket Option)</label>
                <select id="marketSelect">
                    <optgroup label="Forex OTC">
                        <option value="EUR/USD (OTC)">EUR/USD (OTC)</option>
                        <option value="GBP/USD (OTC)">GBP/USD (OTC)</option>
                        <option value="USD/JPY (OTC)">USD/JPY (OTC)</option>
                        <option value="AUD/USD (OTC)">AUD/USD (OTC)</option>
                        <option value="USD/CAD (OTC)">USD/CAD (OTC)</option>
                        <option value="EUR/GBP (OTC)">EUR/GBP (OTC)</option>
                    </optgroup>
                    <optgroup label="Crypto OTC & Real">
                        <option value="BTC/USD (OTC)">Bitcoin (OTC)</option>
                        <option value="ETH/USD (OTC)">Ethereum (OTC)</option>
                        <option value="SOL/USD">Solana Real</option>
                    </optgroup>
                    <optgroup label="Commodities & Indices">
                        <option value="GOLD (OTC)">Gold (OTC)</option>
                        <option value="SILVER (OTC)">Silver (OTC)</option>
                        <option value="US100 (OTC)">US100 (OTC)</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label>Expiration Time (Timeframe)</label>
                <div class="time-selector">
                    <button class="btn-time" onclick="selectTime(this, '5s')">5s</button>
                    <button class="btn-time" onclick="selectTime(this, '10s')">10s</button>
                    <button class="btn-time" onclick="selectTime(this, '15s')">15s</button>
                    <button class="btn-time active" onclick="selectTime(this, '30s')">30s</button>
                    <button class="btn-time" onclick="selectTime(this, '1M')">1M</button>
                    <button class="btn-time" onclick="selectTime(this, '2M')">2M</button>
                    <button class="btn-time" onclick="selectTime(this, '3M')">3M</button>
                    <button class="btn-time" onclick="selectTime(this, '5M')">5M</button>
                </div>
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <label>IA Threshold (Seuil de Confiance)</label>
                <input type="text" value="80% (Strict Confluence)" disabled>
            </div>

            <button class="btn-action btn-analyse" onclick="runAIAnalysis()">
                <i class="fa-solid fa-microchip"></i> DÉMARRER L'ANALYSE IA
            </button>
        </div>

        <!-- PANEL CENTER: LIVE CHART & ANALYSIS -->
        <div class="card">
            <h2><i class="fa-solid fa-chart-line"></i> Market Live Simulation</h2>
            <div style="height: 320px; width: 100%;">
                <canvas id="marketChart"></canvas>
            </div>

            <div class="stats-grid">
                <div class="stat-item"><span>RSI (14)</span><strong id="valRsi">--</strong></div>
                <div class="stat-item"><span>MACD Signal</span><strong id="valMacd">--</strong></div>
                <div class="stat-item"><span>Moving Average (SMA50)</span><strong id="valSma">--</strong></div>
                <div class="stat-item"><span>Bollinger Position</span><strong id="valBb">--</strong></div>
            </div>
        </div>

        <!-- PANEL RIGHT: AI SIGNAL & MARTINGALE -->
        <div class="card">
            <h2><i class="fa-solid fa-robot"></i> AI Signal Output</h2>
            
            <div class="signal-box signal-wait" id="signalBox">
                <div style="font-size: 12px; color: var(--text-sub);">SIGNAL DÉTECTÉ</div>
                <div class="signal-title" id="signalText">WAIT</div>
                <div style="font-size: 13px;" id="confidenceText">Confiance: 0%</div>
                <div class="confidence-meter">
                    <div class="confidence-fill" id="confidenceFill"></div>
                </div>
            </div>

            <h2><i class="fa-solid fa-calculator"></i> Smart Martingale Manager</h2>
            <div class="form-group">
                <label>Mise Initiale ($)</label>
                <input type="number" id="initialStake" value="1.00" onchange="resetStake()">
            </div>
            <div class="form-group">
                <label>Mise Actuelle (Trade Suivant)</label>
                <input type="text" id="currentStake" value="$1.00" readonly style="color: var(--accent-green); font-size: 18px;">
            </div>

            <div class="martingale-controls">
                <button class="btn-action btn-win" onclick="handleTradeResult(true)"><i class="fa-solid fa-trophy"></i> GAGNER</button>
                <button class="btn-action btn-loss" onclick="handleTradeResult(false)"><i class="fa-solid fa-xmark"></i> PERDRE</button>
            </div>
        </div>

    </div>

    <script>
        // --- DATA & STATE MANAGEMENT ---
        let selectedTimeframe = "30s";
        let currentStakeVal = 1.00;
        let chartInstance = null;

        // --- CHART JS SETUP ---
        const ctx = document.getElementById('marketChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array.from({length: 20}, (_, i) => i + 1),
                datasets: [{
                    label: 'Prix du marché',
                    data: Array.from({length: 20}, () => 100 + Math.random() * 5),
                    borderColor: '#29b6f6',
                    backgroundColor: 'rgba(41, 182, 246, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false },
                    y: { grid: { color: '#232a3b' }, ticks: { color: '#90a4ae' } }
                }
            }
        });

        // --- TIMEFRAME SELECTOR ---
        function selectTime(btn, time) {
            document.querySelectorAll('.btn-time').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedTimeframe = time;
        }

        // --- AI MACHINE LEARNING ENGINE SIMULATION ---
        function runAIAnalysis() {
            const signalBox = document.getElementById('signalBox');
            const signalText = document.getElementById('signalText');
            const confidenceText = document.getElementById('confidenceText');
            const confidenceFill = document.getElementById('confidenceFill');

            signalText.innerText = "ANALYSE...";
            signalBox.className = "signal-box signal-wait";

            setTimeout(() => {
                // Generate Synthetic Indicators for Analysis
                const rsi = (Math.random() * 60 + 20).toFixed(2); // 20 to 80
                const macd = (Math.random() * 2 - 1).toFixed(3);
                const sma = (100 + Math.random() * 2).toFixed(2);
                const bbPos = Math.random() > 0.5 ? "Bande Supérieure" : "Bande Inférieure";

                document.getElementById('valRsi').innerText = rsi;
                document.getElementById('valMacd').innerText = macd;
                document.getElementById('valSma').innerText = sma;
                document.getElementById('valBb').innerText = bbPos;

                // Decision Logic (XGBoost / Confluence Simulation)
                let confidence = Math.floor(Math.random() * 30) + 70; // 70% to 99%
                let signal = "WAIT";

                if (rsi < 32 && macd > 0 && bbPos === "Bande Inférieure" && confidence >= 80) {
                    signal = "CALL";
                } else if (rsi > 68 && macd < 0 && bbPos === "Bande Supérieure" && confidence >= 80) {
                    signal = "PUT";
                } else if (confidence >= 82) {
                    signal = Math.random() > 0.5 ? "CALL" : "PUT";
                }

                // Render Results
                if (signal === "CALL") {
                    signalBox.className = "signal-box signal-call";
                    signalText.innerHTML = `<i class="fa-solid fa-arrow-trend-up"></i> CALL`;
                } else if (signal === "PUT") {
                    signalBox.className = "signal-box signal-put";
                    signalText.innerHTML = `<i class="fa-solid fa-arrow-trend-down"></i> PUT`;
                } else {
                    signalBox.className = "signal-box signal-wait";
                    signalText.innerText = "WAIT";
                    confidence = Math.floor(Math.random() * 15) + 60; // Lower confidence display
                }

                confidenceText.innerText = `Confiance IA: ${confidence}%`;
                confidenceFill.style.width = `${confidence}%`;

                // Update Chart Visuals
                chartInstance.data.datasets[0].data.shift();
                chartInstance.data.datasets[0].data.push(100 + Math.random() * 5);
                chartInstance.update();

            }, 800);
        }

        // --- SMART MARTINGALE LOGIC ---
        function handleTradeResult(won) {
            const initial = parseFloat(document.getElementById('initialStake').value) || 1.00;
            if (won) {
                currentStakeVal = initial;
            } else {
                currentStakeVal *= 2.0; // Multiplicateur Martingale
            }
            document.getElementById('currentStake').value = `$${currentStakeVal.toFixed(2)}`;
        }

        function resetStake() {
            const initial = parseFloat(document.getElementById('initialStake').value) || 1.00;
            currentStakeVal = initial;
            document.getElementById('currentStake').value = `$${currentStakeVal.toFixed(2)}`;
        }
    </script>
</body>
</html>
