        <div class="widget-container" id="widget-wrapper">
            <div id="technical-analysis-widget"></div>
        </div>
    </div>

    <script>
        function updateWidget() {
            const symbol = document.getElementById("market").value;
            document.getElementById("widget-wrapper").innerHTML = '<div id="technical-analysis-widget"></div>';
            
            new TradingView.widget({
                "container_id": "technical-analysis-widget",
                "width": "100%",
                "height": 450,
                "symbol": symbol,
                "interval": "1m",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "withdateranges": true,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "details": true,
                "hotlist": false,
                "calendar": false,
                "studies": ["MASimple@tv-basicstudies"],
                "widgetType": "technicalAnalysis"
            });
        }
        
        // Load script
        const script = document.createElement('script');
        script.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
        script.async = true;
        script.innerHTML = JSON.stringify({
            "interval": "1m",
            "width": "100%",
            "height": 450,
            "symbol": "FX:EURUSD",
            "showIntervalTabs": true,
            "displayMode": "single",
            "locale": "en",
            "colorTheme": "dark"
        });
        document.body.appendChild(script);
        window.onload = updateWidget;
    </script>
