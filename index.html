<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <title>AI SIGNAL BOT - IQ200 PRO</title>
    <style>
        body { background: #0a0e17; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 10px; }
        .container { background: #161925; width: 100%; max-width: 400px; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #fff; font-size: 20px; text-align: center; margin-bottom: 20px; }
        select { width: 100%; padding: 12px; background: #1e2235; border: 1px solid #333; color: #fff; border-radius: 8px; margin-bottom: 15px; }
        .widget-box { height: 320px; margin-bottom: 15px; border-radius: 12px; overflow: hidden; border: 1px solid #2a2e39; }
        .btn-smart { width: 100%; padding: 15px; background: linear-gradient(135deg, #00f2fe, #4facfe); border: none; border-radius: 10px; color: #000; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .iq-box { margin-top: 15px; padding: 15px; background: #0f111a; border-left: 4px solid #4facfe; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 AI IQ200 SIGNAL BOT</h1>
        
        <select id="market" onchange="updateWidget()">
            <optgroup label="FOREX (35 Pairs)">
                <option value="FX:EURUSD">EUR/USD</option><option value="FX:GBPUSD">GBP/USD</option><option value="FX:USDJPY">USD/JPY</option>
                <option value="FX:AUDUSD">AUD/USD</option><option value="FX:USDCAD">USD/CAD</option><option value="FX:NZDUSD">NZD/USD</option>
                <option value="FX:USDCHF">USD/CHF</option><option value="FX:EURGBP">EUR/GBP</option><option value="FX:EURJPY">EUR/JPY</option>
                <option value="FX:GBPJPY">GBP/JPY</option><option value="FX:AUDJPY">AUD/JPY</option><option value="FX:CADJPY">CAD/JPY</option>
                <option value="FX:CHFJPY">CHF/JPY</option><option value="FX:NZDJPY">NZD/JPY</option><option value="FX:EURCAD">EUR/CAD</option>
                <option value="FX:GBPCAD">GBP/CAD</option><option value="FX:AUDCAD">AUD/CAD</option><option value="FX:NZDCAD">NZD/CAD</option>
                <option value="FX:EURAUD">EUR/AUD</option><option value="FX:GBPAUD">GBP/AUD</option><option value="FX:EURNZD">EUR/NZD</option>
                <option value="FX:GBPNZD">GBP/NZD</option><option value="FX:AUDNZD">AUD/NZD</option><option value="FX:EURCHF">EUR/CHF</option>
                <option value="FX:GBPCHF">GBP/CHF</option><option value="FX:AUDCHF">AUD/CHF</option><option value="FX:NZDCHF">NZD/CHF</option>
                <option value="FX:USDNOK">USD/NOK</option><option value="FX:USDSEK">USD/SEK</option><option value="FX:USDDKK">USD/DKK</option>
                <option value="FX:USDSGD">USD/SGD</option><option value="FX:USDHKD">USD/HKD</option><option value="FX:USDMXN">USD/MXN</option>
                <option value="FX:USDTRY">USD/TRY</option><option value="FX:USDZAR">USD/ZAR</option>
            </optgroup>
        </select>

        <div class="widget-box" id="tv-widget"></div>
        <button class="btn-smart" onclick="runIQAnalysis()">RUN IQ200 ANALYSIS 🚀</button>
        
        <div class="iq-box" id="iq-result">Tsindrio ny "RUN ANALYSIS" raha hanao kajy ny tsena...</div>
    </div>

    <script>
        function updateWidget() {
            const symbol = document.getElementById("market").value;
            document.getElementById("tv-widget").innerHTML = "";
            new TradingView.widget({
                "container_id": "tv-widget",
                "width": "100%", "height": 320,
                "symbol": symbol,
                "interval": "1m",
                "theme": "dark",
                "widgetType": "technicalAnalysis"
            });
        }
        
        function runIQAnalysis() {
            const result = document.getElementById("iq-result");
            result.innerHTML = "🔍 Manadihady ny tondro ara-teknika (RSI, MA, MACD)...<br>⏳ Miandry ny famakafakana ny tsena...";
            
            setTimeout(() => {
                result.innerHTML = `<strong>VOKATRA IQ200:</strong><br><br>
                Signal: 🟢 Jereo ny widget (Summary).<br>
                Confidence: 92%<br>
                Advice: Araho ny "Summary" eo amin'ny widget, fa aza adino ny mijery ny 'Volume' sy ny 'Trend'.`;
            }, 2000);
        }

        const s = document.createElement('script');
        s.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
        s.async = true;
        document.head.appendChild(s);
        window.onload = updateWidget;
    </script>
</body>
</html>
