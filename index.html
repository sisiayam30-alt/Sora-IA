        .signal-box { margin-top: 20px; padding: 20px; border-radius: 12px; background: #1e2235; }
        .buy { color: #00ff66; font-size: 24px; font-weight: bold; }
        .sell { color: #ff3333; font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 AI SIGNAL BOT</h1>
        
        <select id="market" onchange="loadChart()">
            <optgroup label="FOREX (35 Pairs)">
                <option value="EURUSD">EUR/USD</option><option value="GBPUSD">GBP/USD</option><option value="USDJPY">USD/JPY</option>
                <option value="AUDUSD">AUD/USD</option><option value="USDCAD">USD/CAD</option><option value="NZDUSD">NZD/USD</option>
                <option value="USDCHF">USD/CHF</option><option value="EURGBP">EUR/GBP</option><option value="EURJPY">EUR/JPY</option>

                <option value="GBPJPYOTC">GBP/JPY OTC</option><option value="AUDJPYOTC">AUD/JPY OTC</option><option value="CADJPYOTC">CAD/JPY OTC</option>
                <option value="CHFJPYOTC">CHF/JPY OTC</option><option value="NZDJPYOTC">NZD/JPY OTC</option><option value="EURCADOTC">EUR/CAD OTC</option>
                <option value="GBPCADOTC">GBP/CAD OTC</option><option value="AUDCADOTC">AUD/CAD OTC</option><option value="NZDCADOTC">NZD/CAD OTC</option>
                <option value="EURAUDOTC">EUR/AUD OTC</option><option value="GBPAUDOTC">GBP/AUD OTC</option><option value="EURNZDOTC">EUR/NZD OTC</option>

                <option value="EURGBPOTCA">EUR/GBP OTC-A</option>
            </optgroup>
        </select>

        <select id="timeframe">
            <option value="1">1 Minitra</option>
            <option value="5">5 Minitra</option>
        </select>

        <div class="chart-container" id="tv_live_chart"></div>
        <button onclick="startSignal()">START ANALYSIS 🔍</button>
        
        <div class="signal-box">
            <div id="status">Vonona</div>
            <div id="signal"></div>
        </div>
    </div>

    <script>
        function loadChart() {
            const pair = document.getElementById("market").value;
            new TradingView.widget({
                "width": "100%", "height": "100%", 
                "symbol": "FX:" + pair, 
                "interval": "1", "theme": "dark", "container_id": "tv_live_chart"
            });
        }
        window.onload = loadChart;

        function startSignal() {
            const status = document.getElementById("status");
            let count = 3;
            const timer = setInterval(() => {
                status.innerHTML = `⚠️ ANALYSING TREND... ${count}`;
                count--;
                if (count < 0) {
                    clearInterval(timer);
                    generateSmartSignal();
                }
            }, 1000);
        }

        function generateSmartSignal() {
            const tf = parseInt(document.getElementById("timeframe").value);
            const exp = new Date(new Date().getTime() + (tf * 60000));
            // RSI simulated (Maka tarehimarika eo anelanelan'ny 20-80)
            const rsi = Math.floor(Math.random() * 60) + 20; 
            
            let signal, className, advice;

            if (rsi < 35) {
                signal = "🟢 CALL (HIGHER)";
                className = "buy";
                advice = `RSI: ${rsi} - Oversold, Mety hiakatra.`;
            } else if (rsi > 65) {
                signal = "🔴 PUT (LOWER)";
                className = "sell";
                advice = `RSI: ${rsi} - Overbought, Mety hidina.`;
            } else {
                signal = "⚪ WAIT...";
                className = "";
                advice = `RSI: ${rsi} - Tsena tsy mazava.`;
            }
            
            document.getElementById("status").innerHTML = `🎯 EXP: ${exp.toTimeString().substring(0, 5)} | ${advice}`;
            document.getElementById("signal").innerHTML = signal;
            document.getElementById("signal").className = className;
        }
    </script>
</body>
</html>

        const s = document.createElement('script');
