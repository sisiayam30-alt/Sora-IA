<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <title>AI SIGNAL BOT - PRO</title>
    <style>
        body { background: #0f111a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { background: #161925; width: 100%; max-width: 400px; padding: 20px; border-radius: 16px; text-align: center; }
        select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; background: #1e2235; color: white; border: none; }
        #tv-widget { height: 300px; background: #131722; border-radius: 10px; margin: 10px 0; }
        .info { font-size: 12px; color: #aaa; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 AI SIGNAL BOT</h1>
        
        <select id="market" onchange="loadProChart()">
            <option value="FX:EURUSD">EUR/USD</option>
            <option value="FX:GBPUSD">GBP/USD</option>
            <option value="FX:USDJPY">USD/JPY</option>
            <!-- Ampio ny lisitra hafa rehetra eto -->
        </select>

        <div id="tv-widget"></div>
        <p class="info">Jereo ny "Summary" eo amin'ny chart ho an'ny signal marina.</p>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
    {
      "container_id": "tv-widget",
      "width": "100%",
      "height": "300",
      "symbol": "FX:EURUSD",
      "interval": "1m",
      "theme": "dark",
      "isTransparent": false,
      "showIntervalTabs": true
    }
    </script>

    <script>
        function loadProChart() {
            const pair = document.getElementById("market").value;
            // Fanavaozana ny widget rehefa miova ny pair
            document.getElementById("tv-widget").innerHTML = "";
            new TradingView.widget({
                "container_id": "tv-widget",
                "width": "100%", "height": 300,
                "symbol": pair,
                "interval": "1m",
                "theme": "dark",
                "widgetType": "technicalAnalysis"
            });
        }
    </script>
</body>
</html>
