        <select id="timeframe">
            <option value="1">1 Minitra</option>
            <option value="5">5 Minitra</option>
        </select>

        <div class="chart-container" id="tv_live_chart"></div>
        <button onclick="startSignal()">START ANALYSIS 🔍</button>

    <script>
        function loadChart() {
            const pair = document.getElementById("market").value;
            new TradingView.widget({
                "width": "100%", "height": "100%", 
                "symbol": "FX:" + pair, 
                "interval": "1", "theme": "dark", "container_id": "tv_live_chart"
            });
        }
        window.onload = loadChart;

        function startSignal() {
            const status = document.getElementById("status");
            let count = 3;
            const timer = setInterval(() => {
                status.innerHTML = `⚠️ ANALYSING TREND... ${count}`;
                count--;
                if (count < 0) {
                    clearInterval(timer);
                    generateSmartSignal();
                }
            }, 1000);
        }

        function generateSmartSignal() {
            const tf = parseInt(document.getElementById("timeframe").value);
            const exp = new Date(new Date().getTime() + (tf * 60000));
            // RSI simulated (Maka tarehimarika eo anelanelan'ny 20-80)
            const rsi = Math.floor(Math.random() * 60) + 20; 
            
            let signal, className, advice;

            if (rsi < 35) {
                signal = "🟢 CALL (HIGHER)";
                className = "buy";
                advice = `RSI: ${rsi} - Oversold, Mety hiakatra.`;
            } else if (rsi > 65) {
                signal = "🔴 PUT (LOWER)";
                className = "sell";
                advice = `RSI: ${rsi} - Overbought, Mety hidina.`;
            } else {
                signal = "⚪ WAIT...";
                className = "";
                advice = `RSI: ${rsi} - Tsena tsy mazava.`;
            }
            
            document.getElementById("status").innerHTML = `🎯 EXP: ${exp.toTimeString().substring(0, 5)} | ${advice}`;
            document.getElementById("signal").innerHTML = signal;
            document.getElementById("signal").className = className;
        }
    </script>
</body>
</html>

<script>
    function updateWidget() {
        const s = document.getElementById("market").value;
        const w = document.getElementById("tv-widget");
        if (s.startsWith("OTC:")) {
            w.innerHTML = "<div style='padding:20px; text-align:center;'>OTC MODE: Price Action Only</div>";
        } else {
            w.innerHTML = "";
            new TradingView.widget({
                "container_id": "tv-widget", "width": "100%", "height": 200,
                "symbol": s, "interval": "1m", "theme": "dark", "widgetType": "technicalAnalysis"
            });
        }
    }
    function analyze() {
        const t = document.getElementById("signal-text");
        const b = document.getElementById("signal-box");
        t.innerText = "SCANNING...";
        setTimeout(() => {
            t.innerText = Math.random() > 0.5 ? "SELL" : "BUY";
            b.style.borderColor = t.innerText == "SELL" ? "#ff3333" : "#00e676";
            t.style.color = b.style.borderColor;
        }, 1500);
    }
    window.onload = updateWidget;
</script>
