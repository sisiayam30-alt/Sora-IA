<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Option Advanced AI Signal Bot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #58a6ff;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #8b949e;
        }
        select, input, button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        select:focus, input:focus {
            border-color: #58a6ff;
        }
        .btn-analyze {
            background: #238636;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            border: none;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-analyze:hover {
            background: #2ea043;
        }
        .result-box {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            background: #0d1117;
            border: 1px solid #30363d;
            text-align: center;
        }
        .signal {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 10px 0;
        }
        .call { color: #3fb950; }
        .put { color: #f85149; }
        .wait { color: #d29922; }
        .martingale-box {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-win {
            background: #238636;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-loss {
            background: #da3633;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🤖 POCKET OPTION AI BOT</h2>

    <div class="form-group">
        <label for="asset">Safidio ny Tsena (Market / Asset):</label>
        <select id="asset">
            <optgroup label="Forex Real">
                <option value="EUR/USD">EUR/USD</option>
                <option value="GBP/USD">GBP/USD</option>
                <option value="USD/JPY">USD/JPY</option>
                <option value="AUD/CAD">AUD/CAD</option>
                <option value="EUR/JPY">EUR/JPY</option>
                <option value="EUR/GBP">EUR/GBP</option>
                <option value="NZD/USD">NZD/USD</option>
                <option value="USD/CHF">USD/CHF</option>
            </optgroup>
            <optgroup label="Forex OTC">
                <option value="EUR/USD OTC" selected>EUR/USD OTC</option>
                <option value="GBP/USD OTC">GBP/USD OTC</option>
                <option value="USD/JPY OTC">USD/JPY OTC</option>
                <option value="EUR/JPY OTC">EUR/JPY OTC</option>
                <option value="AUD/USD OTC">AUD/USD OTC</option>
                <option value="NZD/USD OTC">NZD/USD OTC</option>
                <option value="USD/CAD OTC">USD/CAD OTC</option>
            </optgroup>
            <optgroup label="Crypto OTC">
                <option value="BTC/USD OTC">BTC/USD OTC</option>
                <option value="ETH/USD OTC">ETH/USD OTC</option>
                <option value="LTC/USD OTC">LTC/USD OTC</option>
                <option value="XRP/USD OTC">XRP/USD OTC</option>
                <option value="DOGE/USD OTC">DOGE/USD OTC</option>
                <option value="ADA/USD OTC">ADA/USD OTC</option>
                <option value="SOL/USD OTC">SOL/USD OTC</option>
            </optgroup>
        </select>
    </div>

    <div class="form-group">
        <label for="duration">Safidio ny Ora (Timeframe):</label>
        <select id="duration">
            <option value="5s">5 Segondra (5s)</option>
            <option value="10s">10 Segondra (10s)</option>
            <option value="15s">15 Segondra (15s)</option>
            <option value="30s">30 Segondra (30s)</option>
            <option value="1M">1 Minitra (1M)</option>
            <option value="2M">2 Minitra (2M)</option>
            <option value="3M">3 Minitra (3M)</option>
        </select>
    </div>

    <button class="btn-analyze" onclick="startAnalysis()">🔍 START ANALYSE</button>

    <div class="result-box">
        <div>VOKATRA ANALYSE</div>
        <div id="signalResult" class="signal wait">WAIT</div>
        <div id="confidenceResult" style="font-size: 0.9rem; color: #8b949e;">Fahatokisana: --%</div>
        <div id="stakeDisplay" style="margin-top: 8px; font-weight: bold; color: #58a6ff;">Vola Ampiasaina: $1.0</div>
    </div>

    <div class="martingale-box">
        <button class="btn-win" onclick="updateResult(true)">NANDRESY (WIN)</button>
        <button class="btn-loss" onclick="updateResult(false)">RESY (LOSS)</button>
    </div>
</div>

<script>
    let stake = 1.0;
    let initialStake = 1.0;
    let multiplier = 2.0;

    function startAnalysis() {
        const asset = document.getElementById('asset').value;
        const duration = document.getElementById('duration').value;
        const signalElem = document.getElementById('signalResult');
        const confElem = document.getElementById('confidenceResult');

        signalElem.className = 'signal wait';
        signalElem.innerText = 'ANALYZING...';

        setTimeout(() => {
            // Simulation Saina IA (RSI, MACD, MA, Bollinger Bands Consensus)
            const rsi = Math.floor(Math.random() * 100);
            const confidence = (70 + Math.random() * 25).toFixed(2);
            let result = "WAIT";

            if (rsi < 38) {
                result = "CALL";
                signalElem.className = 'signal call';
            } else if (rsi > 62) {
                result = "PUT";
                signalElem.className = 'signal put';
            } else {
                result = (Math.random() > 0.5) ? "CALL" : "PUT";
                signalElem.className = (result === "CALL") ? 'signal call' : 'signal put';
            }

            signalElem.innerText = result;
            confElem.innerText = `Fahatokisana: ${confidence}% | Indicators: RSI, MACD, BB, MA`;
        }, 600);
    }

    function updateResult(won) {
        if (won) {
            stake = initialStake;
            alert("Nandresy! Miverina amin'ny voalohany ny vola.");
        } else {
            stake *= multiplier;
            alert(`Resy! Niakatra ho $${stake.toFixed(1)} ny Martingale.`);
        }
        document.getElementById('stakeDisplay').innerText = `Vola Ampiasaina: $${stake.toFixed(1)}`;
    }
</script>

</body>
            </html>
