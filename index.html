<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <title>AI SIGNAL BOT - PRO ANALYSE</title>
    <style>
        body { background: #0f111a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { background: #161925; width: 100%; max-width: 400px; padding: 20px; border-radius: 16px; text-align: center; }
        select { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: none; background: #1e2235; color: white; cursor: pointer; }
        .widget-wrapper { height: 350px; overflow: hidden; margin: 15px 0; border-radius: 10px; }
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, #ff007f, #7928ca); border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .signal-box { margin-top: 20px; padding: 20px; background: #1e2235; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 AI SIGNAL BOT</h1>
        
        <select id="market" onchange="updateWidget()">
            <optgroup label="FOREX (35 Pairs)">
                <option value="FX:EURUSD">EUR/USD</option><option value="FX:GBPUSD">GBP/USD</option><option value="FX:USDJPY">USD/JPY</option>
                <option value="FX:AUDUSD">AUD/USD</option><option value="FX:USDCAD">USD/CAD</option><option value="FX:NZDUSD">NZD/USD</option>
                <option value="FX:USDCHF">USD/CHF</option><option value="FX:EURGBP">EUR/GBP</option><option value="FX:EURJPY">EUR/JPY</option>
                <option value="FX:GBPJPY">GBP/JPY</option><option value="FX:AUDJPY">AUD/JPY</option><option value="FX:CADJPY">CAD/JPY</option>
                <option value="FX:CHFJPY">CHF/JPY</option><option value="FX:NZDJPY">NZD/JPY</option><option value="FX:EURCAD">EUR/CAD</option>
                <option value="FX:GBPCAD">GBP/CAD</option><option value="FX:AUDCAD">AUD/CAD</option><option value="FX:NZDCAD">NZD/CAD</option>
                <option value="FX:EURAUD">EUR/AUD</option><option value="FX:GBPAUD">GBP/AUD</option><option value="FX:EURNZD">EUR/NZD</option>
                <option value="FX:GBPNZD">GBP/NZD</option><option value="FX:AUDNZD">AUD/NZD</option><option value="FX:EURCHF">EUR/CHF</option>
                <option value="FX:GBPCHF">GBP/CHF</option><option value="FX:AUDCHF">AUD/CHF</option><option value="FX:NZDCHF">NZD/CHF</option>
                <option value="FX:USDNOK">USD/NOK</option><option value="FX:USDSEK">USD/SEK</option><option value="FX:USDDKK">USD/DKK</option>
                <option value="FX:USDSGD">USD/SGD</option><option value="FX:USDHKD">USD/HKD</option><option value="FX:USDMXN">USD/MXN</option>
                <option value="FX:USDTRY">USD/TRY</option><option value="FX:USDZAR">USD/ZAR</option>
            </optgroup>
            <optgroup label="OTC MARKETS (Support only Forex Pairs)">
                <option disabled>OTC pairs lack real-time global data.</option>
            </optgroup>
        </select>

        <div class="widget-wrapper" id="tv-widget"></div>

        <button onclick="getLiveSignal()">HIJERY ANALYSE 🔍</button>
        
        <div class="signal-box">
            <div id="status">Vonona</div>
            <div id="signal"></div>
        </div>
    </div>

    <script>
        function updateWidget() {
            const symbol = document.getElementById("market").value;
            document.getElementById("tv-widget").innerHTML = "";
            new TradingView.widget({
                "container_id": "tv-widget",
                "width": "100%", "height": 350,
                "symbol": symbol,
                "interval": "1m",
                "theme": "dark",
                "widgetType": "technicalAnalysis"
            });
        }
        
        function getLiveSignal() {
            document.getElementById("status").innerHTML = "🎯 FAKO NY ANALYSE:";
            document.getElementById("signal").innerHTML = "Jereo ny 'Summary' eo amin'ny widget:<br>STRONG BUY/BUY = 🟢 CALL<br>STRONG SELL/SELL = 🔴 PUT";
        }

        const script = document.createElement('script');
        script.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
        script.async = true;
        document.head.appendChild(script);
        window.onload = updateWidget;
    </script>
</body>
</html>
