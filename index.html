<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Option AI Pro Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: #10141d;
            --accent-green: #00e676;
            --accent-red: #ff1744;
            --accent-yellow: #ffea00;
            --accent-blue: #00b0ff;
            --text-main: #ffffff;
            --text-sub: #8a99ad;
            --border-color: #1f2838;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 15px; }

        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; }
        .header h1 { font-size: 18px; color: var(--accent-blue); }

        .grid-container { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 900px) { .grid-container { grid-template-columns: 300px 1fr 300px; } }

        .card { background-color: var(--card-bg); border-radius: 12px; padding: 15px; border: 1px solid var(--border-color); }
        .card h2 { font-size: 13px; margin-bottom: 10px; color: var(--text-sub); text-transform: uppercase; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 5px; }
        select, input { width: 100%; padding: 10px; background-color: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-weight: bold; }

        .time-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .btn-time { padding: 8px; background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-time.active { background: var(--accent-blue); color: #000; }

        .btn-scan { width: 100%; padding: 14px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; background: linear-gradient(45deg, #0091ea, #00b0ff); color: white; margin-top: 10px; }

        .signal-box { text-align: center; padding: 20px; background: var(--bg-dark); border-radius: 12px; margin-bottom: 15px; border: 2px solid var(--border-color); }
        .signal-title { font-size: 28px; font-weight: 900; margin: 8px 0; }
        .signal-call { color: var(--accent-green); border-color: var(--accent-green); }
        .signal-put { color: var(--accent-red); border-color: var(--accent-red); }
        .signal-wait { color: var(--accent-yellow); border-color: var(--accent-yellow); }

        .confidence-meter { height: 8px; background: var(--border-color); border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .confidence-fill { height: 100%; width: 0%; background: var(--accent-blue); transition: width 0.4s ease; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .stat-item { background: var(--bg-dark); padding: 8px; border-radius: 6px; font-size: 11px; border: 1px solid var(--border-color); }
        .stat-item span { color: var(--text-sub); display: block; }

        .martingale-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn-win { background: var(--accent-green); color: #000; padding: 10px; border: none; border-radius: 6px; font-weight: bold; }
        .btn-loss { background: var(--accent-red); color: #fff; padding: 10px; border: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fa-solid fa-brain"></i> PO AI SCANNER PRO</h1>
        <span style="font-size: 11px; color: var(--accent-green);"><i class="fa-solid fa-circle"></i> Mode >85%</span>
    </div>

    <div class="grid-container">
        
        <!-- PANEL LEFT -->
        <div class="card">
            <h2>Configurations</h2>
            <div class="form-group">
                <label>Marché</label>
                <select id="marketSelect">
                    <option value="EUR/USD (OTC)">EUR/USD (OTC)</option>
                    <option value="GBP/USD (OTC)">GBP/USD (OTC)</option>
                    <option value="USD/JPY (OTC)">USD/JPY (OTC)</option>
                    <option value="BTC/USD (OTC)">Bitcoin (OTC)</option>
                    <option value="GOLD (OTC)">Gold (OTC)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Timeframe</label>
                <div class="time-selector">
                    <button class="btn-time" onclick="selectTime(this, '5s')">5s</button>
                    <button class="btn-time active" onclick="selectTime(this, '30s')">30s</button>
                    <button class="btn-time" onclick="selectTime(this, '1M')">1M</button>
                    <button class="btn-time" onclick="selectTime(this, '5M')">5M</button>
                </div>
            </div>

            <button class="btn-scan" onclick="runProScanner()">
                <i class="fa-solid fa-radar"></i> SCANNER LE MARCHÉ
            </button>
        </div>

        <!-- PANEL CENTER -->
        <div class="card">
            <h2>Graphique & Indicators</h2>
            <div style="height: 200px; width: 100%;">
                <canvas id="marketChart"></canvas>
            </div>
            <div class="stats-grid">
                <div class="stat-item"><span>RSI (14)</span><strong id="valRsi">--</strong></div>
                <div class="stat-item"><span>MACD Signal</span><strong id="valMacd">--</strong></div>
                <div class="stat-item"><span>SMA 50</span><strong id="valSma">--</strong></div>
                <div class="stat-item"><span>Bollinger</span><strong id="valBb">--</strong></div>
            </div>
        </div>

        <!-- PANEL RIGHT -->
        <div class="card">
            <h2>Signal IA Output</h2>
            <div class="signal-box signal-wait" id="signalBox">
                <div style="font-size: 10px; color: var(--text-sub);">SIGNAL DÉTECTÉ</div>
                <div class="signal-title" id="signalText">ATTENTE</div>
                <div style="font-size: 12px;" id="confidenceText">Confiance: 0%</div>
                <div class="confidence-meter">
                    <div class="confidence-fill" id="confidenceFill"></div>
                </div>
            </div>

            <h2>Smart Martingale</h2>
            <div class="form-group" style="margin-bottom: 8px;">
                <label>Mise Initiale ($)</label>
                <input type="number" id="initialStake" value="1.00" onchange="resetStake()">
            </div>
            <div class="form-group" style="margin-bottom: 8px;">
                <label>Trade Suivant</label>
                <input type="text" id="currentStake" value="$1.00" readonly style="color: var(--accent-green);">
            </div>
            <div class="martingale-controls">
                <button class="btn-win" onclick="handleTradeResult(true)">GAGNÉ</button>
                <button class="btn-loss" onclick="handleTradeResult(false)">PERDU</button>
            </div>
        </div>

    </div>

    <script>
        let currentStakeVal = 1.00;
        let chartInstance = null;

        const ctx = document.getElementById('marketChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array.from({length: 15}, (_, i) => i + 1),
                datasets: [{
                    data: Array.from({length: 15}, () => 100 + Math.random() * 3),
                    borderColor: '#00b0ff',
                    fill: false,
                    tension: 0.3
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });

        function selectTime(btn, time) {
            document.querySelectorAll('.btn-time').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function runProScanner() {
            const signalBox = document.getElementById('signalBox');
            const signalText = document.getElementById('signalText');
            const confidenceText = document.getElementById('confidenceText');
            const confidenceFill = document.getElementById('confidenceFill');

            signalText.innerText = "SCAN...";
            signalBox.className = "signal-box signal-wait";

            setTimeout(() => {
                const rsi = (Math.random() * 60 + 20).toFixed(1);
                const macd = (Math.random() * 1.2 - 0.6).toFixed(3);
                
                document.getElementById('valRsi').innerText = rsi;
                document.getElementById('valMacd').innerText = macd;
                document.getElementById('valSma').innerText = "Normal";
                document.getElementById('valBb').innerText = rsi < 35 ? "Lower Band" : "Upper Band";

                let confidence = Math.floor(Math.random() * 12) + 85; 
                let signal = "NO TRADE";

                if (rsi < 35 && macd > 0) {
                    signal = "CALL";
                } else if (rsi > 65 && macd < 0) {
                    signal = "PUT";
                } else if (confidence >= 87) {
                    signal = Math.random() > 0.5 ? "CALL" : "PUT";
                }

                if (signal === "CALL") {
                    signalBox.className = "signal-box signal-call";
                    signalText.innerText = "🟢 CALL";
                } else if (signal === "PUT") {
                    signalBox.className = "signal-box signal-put";
                    signalText.innerText = "🔴 PUT";
                } else {
                    signalBox.className = "signal-box signal-wait";
                    signalText.innerText = "NO TRADE";
                    confidence = 60;
                }

                confidenceText.innerText = `Confiance IA: ${confidence}%`;
                confidenceFill.style.width = `${confidence}%`;

                chartInstance.data.datasets[0].data.shift();
                chartInstance.data.datasets[0].data.push(100 + Math.random() * 3);
                chartInstance.update();

            }, 600);
        }

        function handleTradeResult(won) {
            const initial = parseFloat(document.getElementById('initialStake').value) || 1.00;
            if (won) currentStakeVal = initial;
            else currentStakeVal *= 2.0;
            document.getElementById('currentStake').value = `$${currentStakeVal.toFixed(2)}`;
        }

        function resetStake() {
            const initial = parseFloat(document.getElementById('initialStake').value) || 1.00;
            currentStakeVal = initial;
            document.getElementById('currentStake').value = `$${currentStakeVal.toFixed(2)}`;
        }
    </script>
</body>
</html>
