<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <title>AI IQ200 - INDICATOR PRO</title>
    <style>
        body { background: #0a0e17; color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { background: #161925; width: 100%; max-width: 400px; padding: 20px; border-radius: 16px; text-align: center; }
        select { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #1e2235; color: #fff; margin-bottom: 15px; }
        .widget-box { height: 350px; margin-bottom: 15px; border-radius: 10px; overflow: hidden; }
        .indicator-board { background: #0f111a; padding: 15px; border-radius: 10px; margin-top: 10px; }
        .signal-btn { width: 100%; padding: 15px; background: #28a745; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 AI IQ200 PRO</h1>
        
        <select id="market" onchange="updateWidget()">
            <optgroup label="Forex Pairs">
                <option value="FX:EURUSD">EUR/USD</option><option value="FX:GBPUSD">GBP/USD</option>
                <option value="FX:USDJPY">USD/JPY</option><option value="FX:AUDUSD">AUD/USD</option>
            </optgroup>
        </select>

        <div class="widget-box" id="tv-widget"></div>
        
        <div class="indicator-board">
            <p>INDICATORS: RSI (14), MA (50), Bollinger Bands</p>
            <button class="signal-btn" onclick="analyzeMarket()">RUN PRO ANALYSIS</button>
        </div>
        
        <div id="result" style="margin-top:15px; font-weight:bold;"></div>
    </div>

    <script>
        function updateWidget() {
            const symbol = document.getElementById("market").value;
            document.getElementById("tv-widget").innerHTML = "";
            new TradingView.widget({
                "container_id": "tv-widget",
                "width": "100%", "height": 350,
                "symbol": symbol,
                "interval": "1m",
                "theme": "dark",
                "widgetType": "technicalAnalysis",
                "studies": ["RSI@tv-basicstudies", "MASimple@tv-basicstudies"]
            });
        }
        
        function analyzeMarket() {
            // Ity no "IQ200" logic: Mampiasa ny "Summary" avy amin'ny widget
            document.getElementById("result").innerHTML = "Analyzing Indicators...<br>Signal: Check 'Summary' below.<br>Strategy: Follow the Trend (Moving Averages).";
        }

        const s = document.createElement('script');
        s.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
        s.async = true;
        document.head.appendChild(s);
        window.onload = updateWidget;
    </script>
</body>
</html>
