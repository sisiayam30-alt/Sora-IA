        .signal-box { margin-top: 20px; padding: 20px; border-radius: 12px; background: #1e2235; }
        .buy { color: #00ff66; font-size: 24px; font-weight: bold; }
        .sell { color: #ff3333; font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>

        <h1>📊 AI SIGNAL BOT</h1>

            </optgroup>
            <optgroup label="OTC MARKETS (65 Pairs)">
                <option value="EURUSDOTC">EUR/USD OTC</option><option value="GBPUSDOTC">GBP/USD OTC</option><option value="AUDUSDOTC">AUD/USD OTC</option>
                <option value="USDJPYOTC">USD/JPY OTC</option><option value="USDCADOTC">USD/CAD OTC</option><option value="NZDUSDOTC">NZD/USD OTC</option>

                <option value="GBPJPYOTC">GBP/JPY OTC</option><option value="AUDJPYOTC">AUD/JPY OTC</option><option value="CADJPYOTC">CAD/JPY OTC</option>

                <option value="LTCUSDTOTC">LTC/USDT OTC</option><option value="ADAUSDTOTC">ADA/USDT OTC</option><option value="SOLUSDTOTC">SOL/USDT OTC</option>

                <option value="USDJPYOTCA">USD/JPY OTC-A</option><option value="EURJPYOTCA">EUR/JPY OTC-A</option><option value="GBPJPYOTCA">GBP/JPY OTC-A</option>
                <option value="NZDUSDOTCA">NZD/USD OTC-A</option><option value="AUDJPYOTCA">AUD/JPY OTC-A</option><option value="USDCADOTCA">USD/CAD OTC-A</option>

        </select>

        <select id="timeframe">
            <option value="1">1 Minitra</option>
            <option value="5">5 Minitra</option>
        </select>

        <div class="chart-container" id="tv_live_chart"></div>
        <button onclick="startSignal()">START ANALYSIS 🔍</button>
        
        <div class="signal-box">
            <div id="status">Vonona</div>
            <div id="signal"></div>
        </div>
    </div>

    <script>
        function loadChart() {
            const pair = document.getElementById("market").value;
            new TradingView.widget({
                "width": "100%", "height": "100%", 
                "symbol": "FX:" + pair, 
                "interval": "1", "theme": "dark", "container_id": "tv_live_chart"
            });
        }
        window.onload = loadChart;

        function startSignal() {
            const status = document.getElementById("status");
            let count = 3;
            const timer = setInterval(() => {
                status.innerHTML = `⚠️ ANALYSING TREND... ${count}`;
                count--;
                if (count < 0) {
                    clearInterval(timer);
                    generateSmartSignal();
                }
            }, 1000);
        }

        function generateSmartSignal() {
            const tf = parseInt(document.getElementById("timeframe").value);
            const exp = new Date(new Date().getTime() + (tf * 60000));
            // RSI simulated (Maka tarehimarika eo anelanelan'ny 20-80)
            const rsi = Math.floor(Math.random() * 60) + 20; 
            
            let signal, className, advice;

            if (rsi < 35) {
                signal = "🟢 CALL (HIGHER)";
                className = "buy";
                advice = `RSI: ${rsi} - Oversold, Mety hiakatra.`;
            } else if (rsi > 65) {
                signal = "🔴 PUT (LOWER)";
                className = "sell";
                advice = `RSI: ${rsi} - Overbought, Mety hidina.`;
            } else {
                signal = "⚪ WAIT...";
                className = "";
                advice = `RSI: ${rsi} - Tsena tsy mazava.`;
            }
            
            document.getElementById("status").innerHTML = `🎯 EXP: ${exp.toTimeString().substring(0, 5)} | ${advice}`;
            document.getElementById("signal").innerHTML = signal;
            document.getElementById("signal").className = className;
        }
    </script>
    <div class="bot-container">
...
</div>
    <div class="header">
        <span>BASILISK</span>
        <span style="color:#00ff66">● LIVE</span>
    </div>

    <select id="widgetMarket" onchange="updateWidget()">
        <optgroup label="FOREX">
            <option value="FX:EURUSD">EUR/USD</option>
            <option value="FX:GBPUSD">GBP/USD</option>
            <option value="FX:USDJPY">USD/JPY</option>
        </optgroup>
        <optgroup label="OTC">
            <option value="OTC:EURUSD">EUR/USD OTC</option>
            <option value="OTC:GBPUSD">GBP/USD OTC</option>
            <option value="OTC:GOLD">GOLD OTC</option>
        </optgroup>
    </select>

    <div id="widget-container"></div>
</div>

<script>
    function updateWidget() {
        const symbol = document.getElementById("widgetMarket").value;
        const container = document.getElementById("widget-container");
        container.innerHTML = "";
        
        const script = document.createElement("script");
        script.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
        script.async = true;
        script.innerHTML = JSON.stringify({
            "interval": "1m",
            "width": "100%",
            "height": "300",
            "symbol": symbol,
            "showIntervalTabs": true,
            "theme": "dark"
        });
        container.appendChild(script);
    }
    window.onload = function () {
    loadChart();
    updateWidget();
};
window.onload = function () {
    loadChart();
    updateWidget();
};
</script>

</body>
</html>
